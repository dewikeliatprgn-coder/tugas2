openapi: 3.0.3
info:
  title: EMBLAZE Backend API
  version: 1.0.0
  description: |
    REST API of the EMBLAZE backend (Node.js + Express + MySQL), taken from `database/server.js`.
    Documents the **implemented** behaviour, including known gaps found during code review.

    **Endpoints:** health check, user registration, login, and checkout (create order).

    **Known gaps (verified by reading the code, see test sheet column "Code Review Note"):**
    * No input validation: missing/invalid fields usually end in HTTP 500 instead of 400.
    * Duplicate username returns 500 (not 409). Email is not unique and not validated.
    * Login with a missing `password` or checkout with a non-array `cart_items` can throw inside an
      async callback and may crash the Node process.
    * No authentication/token: `user_id` in `/api/orders` is trusted from the request body.
    * `price_at_purchase` is supplied by the client; stock is not checked or reduced.
    * Order header and items are inserted without a DB transaction (an order can remain without items).
    * Request bodies larger than 100 KB are rejected by Express with 413.
  contact:
    name: EMBLAZE Group
servers:
  - url: http://localhost:3000
    description: Local / Docker compose (port from PORT env, default 3000)
tags:
  - name: Status
  - name: Auth
  - name: Orders
paths:
  /api/status:
    get:
      tags: [Status]
      summary: Health check
      description: Returns a static message to show the server is running. Does not check the database.
      operationId: getStatus
      responses:
        '200':
          description: Server is online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Backend Emblaze is Online! 🟢"
  /api/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Hashes the password with bcrypt (10 salt rounds) and inserts a row into `users`.
        `username` is UNIQUE in the database.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: qa_user01
              password: Passw0rd!23
              email: qa_user01@mail.test
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User registered successfully!
        '400':
          description: Malformed JSON body (generated by Express body parser, HTML error page)
        '413':
          description: Payload larger than 100 KB (Express default limit)
        '500':
          description: |
            Duplicate username, database error (e.g. NULL / too long value) or hashing error
            (e.g. missing/non-string password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Username sudah ada atau error database!
            text/html:
              schema:
                type: string
              example: Error hashing
  /api/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      description: |
        Looks up the user by `username` and compares the password with the stored bcrypt hash.
        Returns only the `user_id`; no token or session is created.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: qa_user01
              password: Passw0rd!23
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login successful!
                user_id: 1
        '401':
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password salah!
        '404':
          description: Username not found (also returned when the database query fails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User not found!
        '400':
          description: Malformed JSON body (Express body parser)
  /api/orders:
    post:
      tags: [Orders]
      summary: Checkout - create an order with its items
      description: |
        Inserts a row into `orders` (status defaults to `Pending`) and then one row per cart item into
        `order_items`. Responds with the new order id.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              user_id: 1
              cart_items:
                - product_id: 1
                  quantity: 2
                  price_at_purchase: 150000.00
                - product_id: 2
                  quantity: 1
                  price_at_purchase: 75000.50
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                message: Order masuk ke database 3NF!
                orderId: 15
        '400':
          description: cart_items is missing or an empty array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Keranjang kosong!
        '500':
          description: |
            Database failure. `Gagal membuat order induk.` = order header insert failed (e.g. unknown user_id).
            `Gagal menyimpan item belanjaan.` = items insert failed (e.g. unknown product_id); the order header remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                header:
                  value: { message: Gagal membuat order induk. }
                items:
                  value: { message: Gagal menyimpan item belanjaan. }
components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          maxLength: 255
          description: Unique (VARCHAR 255, NOT NULL)
          example: qa_user01
        password:
          type: string
          format: password
          description: Stored as bcrypt hash. Only the first 72 bytes are significant.
          example: Passw0rd!23
        email:
          type: string
          maxLength: 255
          description: VARCHAR 255, NOT NULL (not unique, not format-checked by the server)
          example: qa_user01@mail.test
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: qa_user01
        password:
          type: string
          format: password
          example: Passw0rd!23
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful!
        user_id:
          type: integer
          example: 1
    OrderItem:
      type: object
      required: [product_id, quantity, price_at_purchase]
      properties:
        product_id:
          type: integer
          description: Must exist in `products` (foreign key)
          example: 1
        quantity:
          type: integer
          minimum: 1
          description: INT column; default 1 in the table
          example: 2
        price_at_purchase:
          type: number
          format: double
          description: DECIMAL(10,2), range up to 99999999.99
          example: 150000.00
    OrderRequest:
      type: object
      required: [user_id, cart_items]
      properties:
        user_id:
          type: integer
          description: Must exist in `users` (foreign key)
          example: 1
        cart_items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderResponse:
      type: object
      properties:
        message:
          type: string
          example: Order masuk ke database 3NF!
        orderId:
          type: integer
          example: 15
